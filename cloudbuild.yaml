# cloudbuild.yaml — reetle-social-media
# Same build identity as reetle-push-notifications-trigger (Artifact Registry, Run jobs, GSM build secrets).
serviceAccount: projects/lect-io/serviceAccounts/push-notification-service@lect-io.iam.gserviceaccount.com

substitutions:
  _PROJECT_ID: lect-io
  _REGION: us-central1
  _AR_HOST: us-docker.pkg.dev
  _AR_REPO: lect-io-containers
  _IMAGE_NAME: reetle-social-media
  _SERVICE: reetle-social-media

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # 1) Build container with two tags. The GitHub token for the private
  #    reetle-models repo is passed as a BuildKit secret, so it is never stored
  #    in the image or its history.
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    env: ['DOCKER_BUILDKIT=1']
    args:
      - '-c'
      - |
        set -euo pipefail
        TOKEN_FILE="$(mktemp)"
        trap 'rm -f "$${TOKEN_FILE}"' EXIT
        printf '%s' "$$GITHUB_TOKEN" > "$${TOKEN_FILE}"
        docker build \
          --secret id=github_token,src="$${TOKEN_FILE}" \
          -t ${_AR_HOST}/${_PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:${SHORT_SHA} \
          -t ${_AR_HOST}/${_PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:latest \
          .
    secretEnv: ['GITHUB_TOKEN']

  # 2) Push both tags
  - name: gcr.io/cloud-builders/docker
    args: ['push', '${_AR_HOST}/${_PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:${SHORT_SHA}']

  - name: gcr.io/cloud-builders/docker
    args: ['push', '${_AR_HOST}/${_PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:latest']

  # 3) Update existing Cloud Run Job to latest image
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        gcloud run jobs update ${_SERVICE} \
          --region=${_REGION} \
          --image=${_AR_HOST}/${_PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:${SHORT_SHA}

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/GITHUB_TOKEN/versions/latest
      env: 'GITHUB_TOKEN'
